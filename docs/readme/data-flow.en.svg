<text x="64" y="587" font-size="21" fill="#1f3151" font-weight="650">ClickHouse · clklog</text>
<text x="64" y="616" font-size="17" fill="#60708a" font-weight="400">log_analysis + aggregate tables</text>
<text x="654" y="587" font-size="21" fill="#1f3151" font-weight="650">ClickHouse · clklog_sa</text>
<text x="654" y="616" font-size="17" fill="#60708a" font-weight="400">sa_events + user profiles</text>
<text x="40" y="677" font-size="18" fill="#334c73" font-weight="600">Independent offsets  /  Separate databases  /  Community images and tables unchanged</text>
