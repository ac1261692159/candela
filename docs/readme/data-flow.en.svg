<rect x="460" y="148" width="280" height="95" rx="16" fill="#fff" stroke="#dce3ee"/>
<text x="482" y="183" font-size="22" fill="#1f3151" font-weight="650">nginx</text>
<text x="482" y="212" font-size="18" fill="#60708a" font-weight="400">Reporting entry /receiver/</text>
<rect x="890" y="148" width="270" height="95" rx="16" fill="#fff" stroke="#dce3ee"/>
<text x="912" y="183" font-size="22" fill="#1f3151" font-weight="650">ClkLog receiver</text>
<text x="912" y="212" font-size="18" fill="#60708a" font-weight="400">Receive reported events</text>
<path d="M310 195 H460" fill="none" stroke="#7786a1" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M740 195 H890" fill="none" stroke="#7786a1" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1025 243 V270 H600 V290" fill="none" stroke="#7786a1" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="390" y="290" width="420" height="95" rx="16" fill="#eaf0ff" stroke="#bdcff4"/>
<text x="412" y="325" font-size="22" fill="#1f3151" font-weight="650">Kafka · clklog</text>
<text x="412" y="354" font-size="18" fill="#60708a" font-weight="400">Same topic · separate consumer groups</text>
<path d="M500 385 V411 H305 V434" fill="none" stroke="#7786a1" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M700 385 V411 H895 V434" fill="none" stroke="#7786a1" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="434" width="530" height="204" rx="16" fill="#fff" stroke="#dce3ee"/>
