<text x="654" y="465" font-size="14" fill="#217a60" font-weight="700">CANDELA ANALYTICS</text>
<rect x="64" y="481" width="482" height="62" rx="16" fill="#f5f7fb" stroke="#dce3ee"/>
<text x="86" y="516" font-size="22" fill="#1f3151" font-weight="650">Flink</text>
<rect x="654" y="481" width="482" height="62" rx="16" fill="#e0f3ec" stroke="#b5ddcf"/>
<text x="676" y="516" font-size="22" fill="#1f3151" font-weight="650">analytics-ingestor</text>
