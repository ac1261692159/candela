<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc">
<title id="title">Candela: system and data flow</title><desc id="desc">Kafka fans out to independent community and Candela consumers.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#7786a1"/></marker></defs>
<rect width="1200" height="710" rx="24" fill="#f5f7fb"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="40" y="38" font-size="14" fill="#3265ca" font-weight="700">01 / SYSTEM &amp; DATA FLOW</text>
<text x="40" y="78" font-size="30" fill="#152646" font-weight="700">One event stream. Two independent paths.</text>
<text x="40" y="109" font-size="18" fill="#60708a" font-weight="400">Collection stays with ClkLog. Behavioral analytics runs alongside it.</text>
<rect x="40" y="148" width="270" height="95" rx="16" fill="#fff" stroke="#dce3ee"/>
<text x="62" y="183" font-size="22" fill="#1f3151" font-weight="650">SDK</text>
