<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="910" viewBox="0 0 1200 910" role="img" aria-labelledby="title desc">
<title id="title">Candela：内部职责架构</title><desc id="desc">React 访问 NestJS API，独立 ingestor 消费 Kafka；MySQL、ClickHouse、Redis 各有存储职责，AI 为可选组件。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#7786a1"/></marker></defs>
<rect width="1200" height="910" rx="24" fill="#f5f7fb"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="40" y="38" font-size="14" fill="#3265ca" font-weight="700">02 / INSIDE CANDELA</text>
<text x="40" y="78" font-size="30" fill="#152646" font-weight="700">从探索与查询，到保存与持续监测。</text>
<text x="40" y="109" font-size="18" fill="#60708a" font-weight="400">按逻辑职责分组 · HTTP API 与数据消费分别运行。</text>
