<text x="86" y="434" font-size="22" fill="#1f3151" font-weight="650">分析查询</text>
<text x="86" y="463" font-size="18" fill="#60708a" font-weight="400">事件 / 漏斗 / 留存 / SQL</text>
<rect x="418" y="399" width="330" height="88" rx="16" fill="#f5f7fb" stroke="#dce3ee"/>
<text x="440" y="434" font-size="22" fill="#1f3151" font-weight="650">埋点与用户</text>
<text x="440" y="463" font-size="18" fill="#60708a" font-weight="400">元数据 / 分群 / 标签 / 行为序列</text>
<rect x="64" y="502" width="330" height="88" rx="16" fill="#f5f7fb" stroke="#dce3ee"/>
<text x="86" y="537" font-size="22" fill="#1f3151" font-weight="650">看板与指标</text>
<text x="86" y="566" font-size="18" fill="#60708a" font-weight="400">保存卡片 / 缓存刷新</text>
<rect x="418" y="502" width="330" height="88" rx="16" fill="#f5f7fb" stroke="#dce3ee"/>
<text x="440" y="537" font-size="22" fill="#1f3151" font-weight="650">治理与告警</text>
<text x="440" y="566" font-size="18" fill="#60708a" font-weight="400">质量 / 一致性核对 / 通知投递</text>
