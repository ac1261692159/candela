<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="910" viewBox="0 0 1200 910" role="img" aria-labelledby="title desc">
<title id="title">Candela: internal responsibilities</title><desc id="desc">React calls NestJS APIs. A separate ingestor consumes Kafka. MySQL, ClickHouse and Redis serve distinct storage roles; AI is optional.</desc>
