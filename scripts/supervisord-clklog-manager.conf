; ClkLog analytics-server 分析服务 supervisor 配置
;
; 部署目录: /data/app/clklog_manager/
; 日志目录: /data/logs/production/clklog_manager/
;
; server（HTTP 主服务）与 ingestor（Kafka 消费者）为两个独立部署单元，
; 物理隔离在 server/ 与 ingestor/ 目录，可分别更新/重启/回滚。
;
; 使用：复制到 /etc/supervisord.d/ 后
;   supervisorctl update
;   supervisorctl status
;
; 密钥说明（红线：密钥不入库）：
;   configs/config.yaml 中 CLICKHOUSE_PASSWORD / READONLY_CH_PASSWORD /
;   MYSQL_PASSWORD / DATABASE_URL 通过环境变量注入。下方 environment 使用
;   %(ENV_XXX)s 从 supervisord 进程环境读取，确保 supervisord 启动时已
;   export 这些变量，避免密钥写入本文件。
;   READONLY_CH_PASSWORD 对应 ClickHouse sa_readonly 只读账号（查询用，
;   仅授 clklog_sa 库 SELECT），与 CLICKHOUSE_PASSWORD（default 写账号）隔离。
;   ALERT_CONFIG_KEY 是凭证加密主密钥（32 字节 base64，openssl rand -base64 32），
;   用于告警通道凭证、账号邮件密码与 AI 模型供应商密钥的 AES-256-GCM 加密；
;   缺失时「保存凭证」会明确报错，已有密文会按「不可解密」处理（不静默降级）。
;
; 启动命令说明：
;   使用 bash -c 包装，先执行 `prisma generate` 再 exec node 启动主进程。
;   原因：发版只更新 dist/ 与 prisma/schema.prisma，node_modules 已存在时
;   npm ci 不会执行，Prisma Client 不会随 schema 自动更新；启动前 regenerate
;   可确保新增/修改的模型（如 MetaDiscoveryLog）在运行时可用。generate 幂等且快。
;
; HTTP 主服务
;
; 时区（phase: clklog-analytics-timezone-v1，ZQ-1/ZQ-5）：
;   进程运行时时区固定 UTC——业务日历一律走显式 IANA 时区（src/modules/time/），
;   禁止再依赖「宿主系统时区恰好是 Asia/Shanghai」。TZ=UTC 是防线，不是口径变更。
[program:clklog_analytics_server]
autorestart=True
autostart=True
redirect_stderr=True
; 优雅关闭宽限：默认 10s 会在连接收尾未完成时 SIGKILL（2026-09-18 事故：关闭被 SSE 长连接
; 与容器回收拖过 10s）。应用侧已把各关闭钩子限时在 2–4s，这里留足余量兜底。
stopwaitsecs=25
environment=APP_CONFIG_PATH="/data/app/clklog_manager/server/configs/config.yaml",NODE_ENV="production",TZ="UTC",CLICKHOUSE_PASSWORD="%(ENV_CLICKHOUSE_PASSWORD)s",READONLY_CH_PASSWORD="%(ENV_READONLY_CH_PASSWORD)s",MYSQL_PASSWORD="%(ENV_MYSQL_PASSWORD)s",DATABASE_URL="%(ENV_DATABASE_URL)s",ALERT_CONFIG_KEY="%(ENV_ALERT_CONFIG_KEY)s"
command=/bin/bash -c 'export PATH=/opt/clklog/node-v24.20.0-linux-x64/bin:$PATH; cd /data/app/clklog_manager/server && npx prisma generate && exec /opt/clklog/node-v24.20.0-linux-x64/bin/node dist/src/main.js'
user=root
directory=/data/app/clklog_manager/server/
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=20
stdout_logfile=/data/logs/production/clklog_manager/analytics-server.log

; ingestor（Kafka 消费者）— 独立目录，更新主程序时不受影响
[program:clklog_analytics_ingestor]
autorestart=True
autostart=True
redirect_stderr=True
environment=APP_CONFIG_PATH="/data/app/clklog_manager/ingestor/configs/config.yaml",NODE_ENV="production",TZ="UTC",CLICKHOUSE_PASSWORD="%(ENV_CLICKHOUSE_PASSWORD)s",READONLY_CH_PASSWORD="%(ENV_READONLY_CH_PASSWORD)s",MYSQL_PASSWORD="%(ENV_MYSQL_PASSWORD)s",DATABASE_URL="%(ENV_DATABASE_URL)s",ALERT_CONFIG_KEY="%(ENV_ALERT_CONFIG_KEY)s"
command=/bin/bash -c 'export PATH=/opt/clklog/node-v24.20.0-linux-x64/bin:$PATH; cd /data/app/clklog_manager/ingestor && npx prisma generate && exec /opt/clklog/node-v24.20.0-linux-x64/bin/node dist/src/scripts/run-ingestor.js'
user=root
directory=/data/app/clklog_manager/ingestor/
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=20
stdout_logfile=/data/logs/production/clklog_manager/analytics-ingestor.log
