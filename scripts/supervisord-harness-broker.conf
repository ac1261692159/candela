; Rootless Podman Runtime Broker. It accepts only fixed operations on a 0660 Unix socket.
[program:clklog_harness_broker]
autorestart=True
autostart=True
startsecs=2
stopasgroup=True
killasgroup=True
redirect_stderr=True
environment=HOME="@@HARNESS_HOME@@",XDG_RUNTIME_DIR="/run/user/@@HARNESS_UID@@",NODE_ENV="production"
command=/opt/clklog/node-v24.20.0-linux-x64/bin/node /opt/clklog/harness/current/broker/src/server.mjs --config /etc/clklog/harness-broker.json
user=@@HARNESS_USER@@
directory=@@HARNESS_HOME@@
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
stdout_logfile=/data/logs/production/clklog_manager/harness-broker.log
