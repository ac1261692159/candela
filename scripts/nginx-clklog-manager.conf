# SSE（/plugins/events）不能带 Connection: upgrade，否则经 HTTP/2 入口会 RST。
map $http_upgrade $harness_connection {
    default "";
    websocket upgrade;
}

server {
    listen 80;
    server_name analytics.example;
    access_log  /data/weblogs/candela.access.log main;
    error_log   /data/weblogs/candela.access.err.log;
    proxy_read_timeout 3600;

    root /data/app/clklog_manager/web;
    index index.html;

    location = /lbcheck {
        access_log off;
        return 200;
    }

    location /sa/api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://127.0.0.1:3100;
    }

    # SSE 单独走空 Connection，避免 Tencent CLB HTTP/2 把 Upgrade 转成 RST。
    location ~ ^/sa/harness/air_[A-Za-z0-9_-]+/[0-9]+\.[A-Za-z0-9_-]+/plugins/events {
        gzip off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_set_header Upgrade "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_hide_header Content-Length;
        proxy_hide_header Content-Encoding;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        add_header X-Accel-Buffering no always;
        add_header Cache-Control "no-cache, no-store, no-transform" always;
        proxy_pass http://127.0.0.1:3100;
    }

    location /sa/harness/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $harness_connection;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_pass http://127.0.0.1:3100;
    }

    # 带内容 hash 的静态资源：长缓存 + 缺失即 404（2026-09-19 事故）
    #   - 长缓存：文件名含构建 hash，内容变化必然换名，可放心 immutable；此前无任何 Cache-Control，
    #     每次进入平台都要重下全部 JS/CSS（gzip 后仍有 ~370KB/入口）。
    #   - =404：此前缺失分片会回落 /sa/index.html（200 + text/html），浏览器把 HTML 当 JS 执行 →
    #     静默白屏且无提示。返回 404 后前端错误边界能识别并提示刷新。
    location /sa/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 入口 HTML 不可长缓存：它引用的分片名随构建变化
    location = /sa/index.html {
        add_header Cache-Control "no-cache" always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # 分析 SPA 登录页；旧书签 /login 会落到 basename 之外的空白页
    location = /login {
        return 302 /sa/login;
    }

    location /sa/ {
        try_files $uri $uri/ /sa/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
