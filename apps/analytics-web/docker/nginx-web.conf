# analytics-web 容器内 nginx：只负责静态资源与 SPA 回退
# （/sa/api 与 /sa/harness 由宿主 nginx 直接转发到 manager-server，不经过本容器）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 预压缩产物直出（构建期生成 .gz；客户端不支持 gzip 时自动回落原文件）
    gzip_static on;

    location = /lbcheck {
        access_log off;
        return 200;
    }

    # 带内容 hash 的资源：长缓存 + 缺失即 404
    #   =404 而不是回落到 index.html：缺失分片回落会让浏览器把 HTML 当 JS 执行 → 静默白屏
    location /sa/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 入口 HTML 不可长缓存（引用的分片名随构建变化）
    location = /sa/index.html {
        add_header Cache-Control "no-cache" always;
    }

    location /sa/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /sa/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
